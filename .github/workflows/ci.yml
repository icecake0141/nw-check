name: CI

on:
  push:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Format check
        run: python -m ruff format --check .
      - name: Ruff lint
        run: python -m ruff check src/nw_check
      - name: Pylint
        run: python -m pylint src/nw_check --fail-under=10.0
      - name: Mypy
        run: python -m mypy src/nw_check
      - name: Tests
        run: python -m pytest
